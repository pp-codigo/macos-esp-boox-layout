name: Build Android layout APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Give APK a clear name
        run: cp app/build/outputs/apk/debug/app-debug.apk TOTEM-Espanol-ISO-Boox.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TOTEM-Espanol-ISO-Boox
          path: TOTEM-Espanol-ISO-Boox.apk
          if-no-files-found: error
